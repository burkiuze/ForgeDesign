name: Release

# Push a tag like v0.1.3 to publish a new version. Forge Design's built-in
# updater (Help > Check for Updates) downloads the *-Setup.exe asset.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compiler and NSIS
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 nsis
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build Windows binaries
        run: |
          cargo build --release --target x86_64-pc-windows-gnu -p forge-app -p forge-cli
          x86_64-w64-mingw32-strip target/x86_64-pc-windows-gnu/release/*.exe
      - name: Build setup wizard
        working-directory: packaging/windows
        run: |
          mkdir -p fonts && cp ../../assets/fonts/* fonts/
          cp ../../LICENSE LICENSE.txt
          makensis -DVERSION=${{ steps.v.outputs.version }} -DSRC=../../target/x86_64-pc-windows-gnu/release installer.nsi
      - name: Zip
        run: |
          cd packaging/windows
          zip -9 ForgeDesign-${{ steps.v.outputs.version }}-Windows-Setup.zip ForgeDesign-${{ steps.v.outputs.version }}-Setup.exe
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/windows/ForgeDesign-${{ steps.v.outputs.version }}-Setup.exe
            packaging/windows/ForgeDesign-${{ steps.v.outputs.version }}-Windows-Setup.zip
          generate_release_notes: true
