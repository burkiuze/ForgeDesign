[package]
name = "forge-app"
description = "Forge Design desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
forge-io = { path = "../forge-io" }
eframe = "0.29"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "wayland"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", features = ["json"] }
